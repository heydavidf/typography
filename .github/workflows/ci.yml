# Checks for this Markdown-only agent skill repository. The skill has no code to lint or unit-test,
# so the checks are: skill layout, tests for the check scripts, Agent Skills format, tripwire,
# secrets and links.
# Runs on every push to main, on pull requests and weekly (the weekly run also checks external links).
# AGENTS.md lists the same checks for running locally.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Skill layout (where gh skill install looks)
        run: bash .github/check-skill-layout.sh

      - name: Tests for the check scripts
        run: bash .github/test-checks.sh

      - name: Agent Skills spec (skills-ref, pinned)
        run: |
          python -m venv "$RUNNER_TEMP/skills-ref"
          "$RUNNER_TEMP/skills-ref/bin/pip" install --quiet 'skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
          for skill in skills/*/; do
            "$RUNNER_TEMP/skills-ref/bin/skills-ref" validate "$PWD/${skill%/}"
          done

      - name: Tripwire (personal paths, junk files, silenced checks)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_REF" ] && git cat-file -e "$BASE_REF^{commit}" 2>/dev/null; then
            bash .github/tripwire.sh "$BASE_REF"
          elif [ "$EVENT" = pull_request ]; then
            echo "::error::Base commit '$BASE_REF' is not in the checkout, so silenced checks cannot be compared."
            exit 1
          else
            echo "::notice::No base commit for this $EVENT run ('${BASE_REF:-none}'); checking junk files and personal paths only."
            bash .github/tripwire.sh
          fi

      - name: Secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Links (local on every run, external weekly)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: ${{ github.event_name == 'schedule' && '--no-progress .' || '--offline --no-progress .' }}
          fail: true
